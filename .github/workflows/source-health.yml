name: Source Health

on:
  schedule:
    # 每 3 小时检查一次；清单超过 12 小时没更新才探测（NAS 为主，这里只兜底）
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-health.yml'
      - 'scripts/probe-source-health.mjs'
      - 'scripts/publish-source-health.mjs'

permissions:
  contents: write

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check freshness
        id: freshness
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "probe=true" >> "$GITHUB_OUTPUT"
            echo "manual or explicit run: probe now"
            exit 0
          fi
          node - <<'NODE'
          const fs = require('fs');
          let ageHours = Infinity;
          try {
            const data = JSON.parse(
              fs.readFileSync('public/docs/sources_health.json', 'utf8')
            );
            const generated = Date.parse(data.generated_at);
            if (!Number.isNaN(generated)) {
              ageHours = (Date.now() - generated) / 3600000;
            }
          } catch {}
          const probe = ageHours >= 12;
          console.log(`list age=${ageHours.toFixed(1)}h probe=${probe}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `probe=${probe}\n`);
          NODE

      - name: Probe sources
        if: steps.freshness.outputs.probe == 'true'
        run: node scripts/probe-source-health.mjs

      - name: Publish result
        if: steps.freshness.outputs.probe == 'true'
        run: |
          if git diff --quiet -- public/docs/sources_health.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/docs/sources_health.json
          git commit -m "chore(source-health): refresh health list"
          git push
